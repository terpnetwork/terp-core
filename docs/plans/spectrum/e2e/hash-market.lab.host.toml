# Host-path lab config for Private Bridge corridor notify plane.
# Honest scope: lab only — not mainnet BTC/ZEC / Cash App.
#
# data_dir is relative to process CWD; the just recipe sets CWD to a temp/lab dir.
# Docker uses hash-market.lab.toml (absolute /var/lib/hash-market).

bind = "127.0.0.1:19090"
chain_id = "corridor-lab-1"
data_dir = "data"
ve_enabled = false
cors_allow_origin = "*"
