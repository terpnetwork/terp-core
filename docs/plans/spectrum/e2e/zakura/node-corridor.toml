# Single Zakura regtest node for Private Bridge corridor dest addresses (D6).
# Host networking + host-built zakurad (same pattern as zakura-regtest-e2e).
# No mainnet sync.

[network]
network = "Regtest"
listen_addr = "127.0.0.1:18233"
p2p_stack = "legacy"
cache_dir = false
initial_testnet_peers = []
max_connections_per_ip = 4

[state]
ephemeral = true

[rpc]
listen_addr = "127.0.0.1:18232"
enable_cookie_auth = false

[metrics]
endpoint_addr = "127.0.0.1:19901"

[mining]
internal_miner = false
# Transparent regtest P2PKH — use as demo dest when wallet RPC unavailable.
# Zakura core has no getnewaddress (wallet is zcashd-compat residual).
miner_address = "tmJymvcUCn1ctbghvTJpXBwHiMEB8P6wxNV"

[tracing]
filter = "info"
