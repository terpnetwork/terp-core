# Private Bridge — ict_local_funded BTC regtest side car
#
# Pairs with corridor-ict-funded.sh (hash-market + reporter bitcoind backend +
# ict-rs Terp + BridgeMintNote). Not mainnet money.
#
# Usage:
#   docker compose -f docker-compose.corridor-funded.yml up -d bitcoind
#   # RPC: http://127.0.0.1:18443  user=corridor pass=corridor

name: corridor-ict-funded

services:
  bitcoind:
    image: ${BITCOIND_IMAGE:-bitcoin/bitcoin:27.0}
    container_name: corridor-bitcoind-regtest
    ports:
      - "${BITCOIND_RPC_PORT:-18443}:18443"
      - "${BITCOIND_P2P_PORT:-18444}:18444"
    environment:
      BITCOIN_DATA: /data
    volumes:
      - corridor-bitcoind-data:/data
    command:
      - bitcoind
      - -regtest
      - -server
      - -txindex
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=corridor
      - -rpcpassword=corridor
      - -rpcport=18443
      - -fallbackfee=0.0002
      - -printtoconsole
    healthcheck:
      test:
        [
          "CMD",
          "bitcoin-cli",
          "-regtest",
          "-rpcuser=corridor",
          "-rpcpassword=corridor",
          "-rpcport=18443",
          "getblockchaininfo",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  corridor-bitcoind-data:
