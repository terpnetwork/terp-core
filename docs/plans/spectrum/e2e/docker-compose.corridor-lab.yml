# Private Bridge corridor — local lab stack (honest: not mainnet BTC/ZEC)
#
# Services:
#   hash-market-server  — notes + deposit notify + optional oracle
#   lab-observer        — synthetic deposit.observed (replaces bitcoind/Fulcrum in lab)
#
# Preferred working path is **host Layer A** (see corridor-lab-host.sh / just demo-corridor-lab).
# Docker is optional: image build from terp-rs is multi-minute and needs workspace COPY context.
#
# Build image (from crates/terp-rs):
#   docker build -t terp/hash-market:corridor-lab -f tools/hash-market/Dockerfile \
#     --build-arg FEATURES=server .
#
# Then:
#   docker compose -f docs/plans/spectrum/e2e/docker-compose.corridor-lab.yml up
#
# Smoke (host):
#   export HASH_MARKET_URL=http://127.0.0.1:19090
#   bash docs/plans/spectrum/e2e/corridor-lab-smoke.sh
#
# Residual for oline: Fulcrum packaging + corridor-btc-reporter electrum backend
# (see tools/hash-market/docs/corridor-btc-reporter.md).
#
# Design freezes: DESIGN-DECISIONS-CORRIDOR-2026-07-20.md D1–D7

name: terp-corridor-lab

services:
  hash-market:
    # Prefer pre-tagged image; optional build when build context is available.
    image: terp/hash-market:corridor-lab
    build:
      context: ../../../../crates/terp-rs
      dockerfile: tools/hash-market/Dockerfile
      args:
        FEATURES: server
    container_name: corridor-hash-market
    ports:
      - "19090:9090"
    environment:
      RUST_LOG: info,hash_market=debug
      HM_CONFIG: /etc/hash-market/config.toml
      HM_DATA: /var/lib/hash-market
    volumes:
      - corridor-hm-data:/var/lib/hash-market
      - ./hash-market.lab.toml:/etc/hash-market/config.toml:ro
    # entrypoint expects /etc/hash-market/config.toml for direct mode
    healthcheck:
      # alpine runtime has busybox wget
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Lab observer: posts deposit.observed for open watches without bitcoind.
  # Production oline replaces this with corridor-btc-reporter + Fulcrum.
  lab-observer:
    image: curlimages/curl:8.5.0
    container_name: corridor-lab-observer
    depends_on:
      hash-market:
        condition: service_healthy
    volumes:
      - ./lab-observer.sh:/lab-observer.sh:ro
    entrypoint: ["/bin/sh", "/lab-observer.sh"]
    environment:
      HASH_MARKET_URL: http://hash-market:9090
      POLL_SECS: "5"

volumes:
  corridor-hm-data:
