# Local soundness check for act. Not a pull-request gate.
# Run: ./scripts/ci/act.sh workflow_dispatch -W .github/workflows/act-soundness.yml
# Use the host architecture (groot2 is linux/amd64). The wrapper deletes containers.
name: act-soundness

on:
  workflow_dispatch:

jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - name: Chain forks at gitlink SHAs
        run: |
          set -euo pipefail
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git submodule update --init crates/zk-wasmd crates/zk-wasmvm crates/cosmwasm
          fi
          test -f crates/zk-wasmvm/go.mod
          test -f crates/cosmwasm/Cargo.toml
          test -f crates/zk-wasmd/go.mod
      - name: Published muslc
        run: ./scripts/release/fetch_zk_muslc.sh crates/zk-wasmvm/internal/api
      - name: Published packs match S3
        run: |
          set -euo pipefail
          PLAN=v6.3 CHECK_S3=1 bash scripts/release/verify_upgrade_pack.sh
          PLAN=v6.4 CHECK_S3=1 bash scripts/release/verify_upgrade_pack.sh
