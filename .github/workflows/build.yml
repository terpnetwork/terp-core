---
name: build

on:
  push:
    paths:
      - '**.go'
      - 'go.sum'
      - 'go.mod'
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'scripts/release/ensure_source_deps.sh'
      - 'scripts/release/SOURCE_DEPS.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25

# Monorepo submodule policy:
# - go.mod path-replaces wasmd/wasmvm/ibc-hooks → ./crates/{zk-wasmd,zk-wasmvm,ibc-hooks-v11}
# - Do not init crates/cosmwasm: Cargo tree + go-gen fixtures are not a Go module
#   (go-gen tests lack `package`; `go build ./...` then fails).
# - SKIP full recursive checkout (60+ crates) to avoid runner bloat
# - ensure_source_deps.sh inits the gitlinks + ibc-hooks tarball if missing

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Init Go path-replace crates
        run: bash scripts/release/ensure_source_deps.sh
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.ACT == '' }}
      # muslc: pinned ZK libwasmvm_muslc.x86_64.a (glibc .so in wasmvm git lacks ZK FFI)
      # -lm: rust muslc archive references libm (log)
      - run: CGO_ENABLED=1 CGO_LDFLAGS="-lm" go build -tags "netgo ledger muslc" ./...

  test:
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.ACT == '' }}
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Init Go path-replace crates
        run: bash scripts/release/ensure_source_deps.sh
      - name: Test
        run: CGO_ENABLED=1 CGO_LDFLAGS="-lm" go test -tags "netgo ledger muslc" ./...

  tidy:
    runs-on: ubuntu-latest
    name: tidy
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Init Go path-replace crates
        run: bash scripts/release/ensure_source_deps.sh
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.ACT == '' }}
      - run: |
          go mod tidy
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            CHANGES_IN_REPO=$(git status --porcelain)
            if [[ -n "$CHANGES_IN_REPO" ]]; then
              echo "Repository is dirty. Showing 'git status' and 'git --no-pager diff' for debugging now:"
              git status && git --no-pager diff
              exit 1
            fi
          else
            echo "skip git status (not a git work tree)"
          fi
