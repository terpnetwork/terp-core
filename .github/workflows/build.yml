---
name: build

on:
  push:
    paths:
      - '**.go'
      - 'go.sum'
      - 'go.mod'
      - '.github/workflows/build.yml'
      - '.gitmodules'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25

# Monorepo submodule policy:
# - go.mod path-replaces CosmWasm → ./crates/zk-wasmd and ./crates/zk-wasmvm
# - SKIP full recursive checkout (60+ crates) to avoid runner bloat
# - Only init the path-replace submodules required for go build/test/tidy

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Init Go path-replace submodules
        run: git submodule update --init --depth 1 crates/zk-wasmd crates/zk-wasmvm
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Init Go path-replace submodules
        run: git submodule update --init --depth 1 crates/zk-wasmd crates/zk-wasmvm
      - name: Test
        run: go test ./...

  tidy:
    runs-on: ubuntu-latest
    name: tidy
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Init Go path-replace submodules
        run: git submodule update --init --depth 1 crates/zk-wasmd crates/zk-wasmvm
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          go mod tidy
          CHANGES_IN_REPO=$(git status --porcelain)
          if [[ -n "$CHANGES_IN_REPO" ]]; then
            echo "Repository is dirty. Showing 'git status' and 'git --no-pager diff' for debugging now:"
            git status && git --no-pager diff
            exit 1
          fi
