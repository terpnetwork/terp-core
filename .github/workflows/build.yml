---
name: build

on:
  push:
    paths:
      - '**.go'
      - 'go.sum'
      - 'go.mod'
      - '.github/workflows/build.yml'
      - '.gitmodules'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  GOTOOLCHAIN: local

# Monorepo submodule policy:
# - go.mod path-replaces wasmvm → ./x/wasm/wasmvm. wasmd stays in-tree at x/wasm.
# - crates/zk-wasmd and crates/zk-wasmvm are not submodules.
# - The only wasm-library submodule is crates/cosmwasm (release/v6.3.0-wasmer).
# - libwasmvm fetches that commit by git rev, so Go jobs do not need it checked out.
# - SKIP full recursive checkout (60+ crates) to avoid runner bloat.

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Confirm in-tree wasm
        run: |
          test -f x/wasm/keeper/keeper.go
          test -f x/wasm/wasmvm/libwasmvm/Cargo.toml
          if [ ! -f crates/cosmwasm/Cargo.toml ]; then
            git submodule update --init --depth 1 crates/cosmwasm
          fi
      - name: Hasher packaging
        run: ./scripts/release/curate_v63.sh
      - name: Published muslc
        run: ./scripts/release/fetch_zk_muslc.sh x/wasm/wasmvm/internal/api
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          set -euo pipefail
          # Linux go links the published muslc archive. go-gen fixtures are
          # rust snapshots without a package clause; any other list error fails.
          list="$(go list -e -f '{{if .Error}}ERR {{.ImportPath}}{{else}}{{.ImportPath}}{{end}}' ./...)"
          bad="$(printf '%s\n' "$list" | grep '^ERR ' | grep -v '/crates/cosmwasm/packages/go-gen' || true)"
          if [ -n "$bad" ]; then
            echo "$bad" >&2
            exit 1
          fi
          pkgs=()
          while IFS= read -r p; do
            pkgs+=("$p")
          done < <(printf '%s\n' "$list" | grep -v '^ERR ')
          go build -tags muslc "${pkgs[@]}"

  test:
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Confirm in-tree wasm
        run: |
          test -f x/wasm/keeper/keeper.go
          test -f x/wasm/wasmvm/libwasmvm/Cargo.toml
          if [ ! -f crates/cosmwasm/Cargo.toml ]; then
            git submodule update --init --depth 1 crates/cosmwasm
          fi
      - name: Hasher packaging
        run: ./scripts/release/curate_v63.sh
      - name: Published muslc
        run: ./scripts/release/fetch_zk_muslc.sh x/wasm/wasmvm/internal/api
      - name: Test
        run: |
          set -euo pipefail
          list="$(go list -e -f '{{if .Error}}ERR {{.ImportPath}}{{else}}{{.ImportPath}}{{end}}' ./...)"
          bad="$(printf '%s\n' "$list" | grep '^ERR ' | grep -v '/crates/cosmwasm/packages/go-gen' || true)"
          if [ -n "$bad" ]; then
            echo "$bad" >&2
            exit 1
          fi
          pkgs=()
          while IFS= read -r p; do
            pkgs+=("$p")
          done < <(printf '%s\n' "$list" | grep -v '^ERR ')
          go test -tags muslc "${pkgs[@]}"

  tidy:
    runs-on: ubuntu-latest
    name: tidy
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Confirm in-tree wasm
        run: |
          test -f x/wasm/keeper/keeper.go
          test -f x/wasm/wasmvm/libwasmvm/Cargo.toml
          if [ ! -f crates/cosmwasm/Cargo.toml ]; then
            git submodule update --init --depth 1 crates/cosmwasm
          fi
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          go mod tidy
          CHANGES_IN_REPO=$(git status --porcelain)
          if [[ -n "$CHANGES_IN_REPO" ]]; then
            echo "Repository is dirty. Showing 'git status' and 'git --no-pager diff' for debugging now:"
            git status && git --no-pager diff
            exit 1
          fi
