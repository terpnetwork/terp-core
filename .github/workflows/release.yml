---
name: Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Chain forks at this tag's gitlinks
        run: git submodule update --init crates/zk-wasmd crates/zk-wasmvm crates/cosmwasm

      - name: Published muslc and ibc-hooks
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          extras="scripts/release/fresh-vm/releases/${tag}.sh"
          if [ -f "$extras" ]; then
            # shellcheck disable=SC1090
            . "$extras"
          fi
          ./scripts/release/fetch_zk_muslc.sh crates/zk-wasmvm/internal/api
          if [ ! -f crates/ibc-hooks-v11/go.mod ]; then
            url="${IBC_HOOKS_URL:-https://minio.terp.network/releases/terp-core/v6.0.0-dev/ibc-hooks-v11.tar.gz}"
            curl -fsSL -o /tmp/ibc-hooks-v11.tar.gz "$url"
            tar -C crates -xzf /tmp/ibc-hooks-v11.tar.gz
          fi
          {
            echo "build_tags=${BUILD_TAGS:-}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Go version
        id: go-version
        run: echo "version=$(grep -E '^go [0-9]' go.mod | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Build binary via Docker
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA}"
          # fresh-vm extras set BUILD_TAGS=v64 for v6.4. Docker always needs muslc.
          TAGS="muslc"
          if [ -n "${build_tags:-}" ]; then
            TAGS="muslc ${build_tags}"
          fi

          docker buildx create --name terpbuilder --use || docker buildx use terpbuilder

          docker buildx build \
            --build-arg GO_VERSION=${{ steps.go-version.outputs.version }} \
            --build-arg GIT_VERSION="${VERSION}" \
            --build-arg GIT_COMMIT="${COMMIT}" \
            --build-arg WASMVM_SOURCE=local \
            --build-arg BUILD_TAGS="${TAGS}" \
            --build-arg RUNNER_IMAGE=alpine:3.17 \
            --platform linux/${{ matrix.arch }} \
            -t terp-core:local-${{ matrix.arch }} \
            --load \
            -f Dockerfile .

          docker rm -f terpbinary || true
          docker create --platform linux/${{ matrix.arch }} -ti --name terpbinary terp-core:local-${{ matrix.arch }}
          mkdir -p build
          docker cp terpbinary:/usr/local/bin/terpd build/terpd-linux-${{ matrix.arch }}
          docker rm -f terpbinary

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: terpd-linux-${{ matrix.arch }}
          path: build/terpd-linux-${{ matrix.arch }}
          retention-days: 1

  release:
    name: Create Release Artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SKIP submodules:recursive — release binaries built via Dockerfile
          # (github wasmvm). crates/ dockerignored; recursive not required.
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true

      - name: Generate checksums
        working-directory: build
        run: |
          sha256sum terpd-linux-amd64 terpd-linux-arm64 > sha256sum.txt
          cat sha256sum.txt

      - name: Create Cosmovisor tarballs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EPOCH="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          for arch in amd64 arm64; do
            SOURCE_DATE_EPOCH="$EPOCH" bash scripts/release/pack_cv_tarball.sh \
              "build/terpd-linux-${arch}" \
              "build/terpd-${VERSION}-linux-${arch}.tar.gz"
            sha256sum "build/terpd-${VERSION}-linux-${arch}.tar.gz" >> build/sha256sum.txt
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/terpd-linux-amd64
            build/terpd-linux-arm64
            build/terpd-*-linux-*.tar.gz
            build/sha256sum.txt
