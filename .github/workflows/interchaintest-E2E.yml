name: ict-rs E2E

# Called by ci-dev and ci-release after a code-owner gate.
# Uses the published ict-ci tarball (scripts/ci/fetch-ict-rs-bins.sh). Does not compile ict-rs.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAR_PATH: /tmp/terp-docker-image.tar
  PREBUILT_HOST: https://minio.terp.network
  # Pins live in scripts/ci/terp-prebuilt.env and scripts/ci/ict-rs-bins.env
  # (refresh with scripts/ci/pin-latest-prebuilts.sh after a MinIO publish).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discover suites from the pinned ict-ci binary so the matrix matches
  # what that prebuild actually ships (not a stale YAML list).
  discover-suites:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Show pins
        run: |
          set -euo pipefail
          echo "== terp-core pin =="
          cat scripts/ci/terp-prebuilt.env
          bash scripts/ci/resolve-prebuilt.sh
          echo "== ict-rs pin =="
          cat scripts/ci/ict-rs-bins.env

      - name: Download prebuilt ict-rs bins for pinned commit
        run: bash scripts/ci/fetch-ict-rs-bins.sh /tmp/ict-bins

      - name: Matrix from ict-ci list
        id: list
        run: |
          set -euo pipefail
          json=$(ICT_CI_ALLOWLIST="${ICT_CI_ALLOWLIST:-aa,pfm,ibchooks,hashmerchant,staking-hooks}" \
            bash scripts/ci/list-ict-ci-suites.sh /tmp/ict-bins)
          echo "suites=$json" >> "$GITHUB_OUTPUT"
          echo "pinned ict-ci suites: $json"

  e2e-tests:
    needs: discover-suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover-suites.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch pinned terp-core prebuilt
        run: bash scripts/ci/fetch-prebuilt.sh /tmp/terp-prebuilt

      - name: Load prebuilt chain image
        run: |
          set -euo pipefail
          docker image load -i /tmp/terp-prebuilt/terp-core-local-linux-amd64.tar
          docker image inspect terpnetwork/terp-core:local >/dev/null
          echo "SOURCE_COMMIT=$(cat /tmp/terp-prebuilt/SOURCE_COMMIT)"

      - name: Download prebuilt ict-rs bins for pinned commit
        run: bash scripts/ci/fetch-ict-rs-bins.sh /tmp/ict-bins

      - name: Require polytone wasm
        if: ${{ matrix.suite == 'polytone' }}
        run: |
          test -f tests/interchaintest/contracts/polytone_note.wasm
          test -f tests/interchaintest/contracts/polytone_voice.wasm
          test -f tests/interchaintest/contracts/polytone_proxy.wasm
          test -f tests/interchaintest/contracts/polytone_tester.wasm

      - name: Run suite
        env:
          TERP_CORE: ${{ github.workspace }}
          TERP_IMAGE_REPO: terpnetwork/terp-core
          TERP_IMAGE_VERSION: local
          ICT_CI_BIN_DIR: /tmp/ict-bins/examples
        run: /tmp/ict-bins/ict-ci run ${{ matrix.suite }}

      - name: Upload prebuilt terpd digest
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v5
        with:
          name: prebuilt-terpd
          path: |
            /tmp/terp-prebuilt/terpd-linux-amd64
            /tmp/terp-prebuilt/terpd-linux-amd64.sha256
            /tmp/terp-prebuilt/SOURCE_COMMIT
          retention-days: 3
