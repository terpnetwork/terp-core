name: ict-rs E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "**"
    branches:
      - "main"
      - "master"
      - "v6.0.0-dev"

permissions:
  contents: read

env:
  TAR_PATH: /tmp/terp-docker-image.tar
  IMAGE_NAME: terp-docker-image
  # Pinned prebuilt ict-ci. Hosted on our MinIO, not GitHub Releases.
  # Bump ICT_RS_RELEASE + URL together (scripts/ci/ict-rs-bins.env).
  ICT_RS_RELEASE: v0.1.0
  ICT_RS_BINS_URL: https://minio.terp.network/releases/ict-rs/v0.1.0/ict-ci-linux-x86_64.tar.gz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: terpnetwork/terp-core:local
          outputs: type=docker,dest=${{ env.TAR_PATH }}
          cache-from: type=gha,scope=terp-core-e2e
          cache-to: type=gha,mode=max,scope=terp-core-e2e

      - name: Upload image
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.IMAGE_NAME }}
          path: ${{ env.TAR_PATH }}
          retention-days: 3

  e2e-tests:
    needs: [build-docker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ibc_transfer
          - polytone
    steps:
      - name: Checkout (wasm under tests/interchaintest/contracts)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download image
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.IMAGE_NAME }}
          path: /tmp

      - name: Load image
        run: |
          docker image load -i ${{ env.TAR_PATH }}
          docker image inspect terpnetwork/terp-core:local >/dev/null

      - name: Download pinned ict-rs bins
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ict-ci-linux-x86_64.tar.gz "${{ env.ICT_RS_BINS_URL }}"
          mkdir -p /tmp/ict-bins
          tar -C /tmp/ict-bins -xzf /tmp/ict-ci-linux-x86_64.tar.gz
          chmod +x /tmp/ict-bins/ict-ci /tmp/ict-bins/examples/*
          /tmp/ict-bins/ict-ci list || true
          test -x /tmp/ict-bins/examples/ibc_transfer
          test -x /tmp/ict-bins/examples/polytone

      - name: Require polytone wasm
        if: ${{ matrix.suite == 'polytone' }}
        run: |
          test -f tests/interchaintest/contracts/polytone_note.wasm
          test -f tests/interchaintest/contracts/polytone_voice.wasm
          test -f tests/interchaintest/contracts/polytone_proxy.wasm
          test -f tests/interchaintest/contracts/polytone_tester.wasm

      - name: Run suite
        env:
          TERP_CORE: ${{ github.workspace }}
          TERP_IMAGE_REPO: terpnetwork/terp-core
          TERP_IMAGE_VERSION: local
          ICT_CI_BIN_DIR: /tmp/ict-bins/examples
        run: |
          /tmp/ict-bins/ict-ci run ${{ matrix.suite }}
