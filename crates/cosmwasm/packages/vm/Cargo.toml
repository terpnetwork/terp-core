[package]
name = "cosmwasm-vm"
version = { workspace = true }
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
description = "VM bindings to run CosmWasm contracts"
repository = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[package.metadata.optimizer]
standard-build = true
builds = [{ name = "cosmwasm-vm", default-features = true }]

[lib]
# See https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
bench = false

[features]
default = ["iterator", "staking", "zk"]
# iterator allows us to iterate over all DB items in a given range
# this must be enabled to support CosmWasm contracts compiled with the 'iterator' feature
# optional as some merkle stores (like tries) don't support this
# given Ethereum 1.0, 2.0, Substrate, and other major projects use Tries
# we keep this optional, to allow possible future integration (or different Cosmos Backends)
iterator = ["cosmwasm-std/iterator"]
staking = ["cosmwasm-std/staking"]
# this enables all stargate-related functionality, including the ibc entry points
stargate = ["cosmwasm-std/stargate"]
# For heap profiling. Only used in the "heap_profiling" example.
dhat-heap = ["dep:dhat"]
# ibc2 enables ibc2-dependent messages, entrypoints and queries
ibc2 = ["cosmwasm-std/ibc2"]
zk = ["cosmwasm-std/zk", "dep:zk-cosmwasm"]
# BN254 (alt_bn128) curve host functions — EIP-196/197/1108
# Also enables zk-cosmwasm BN254 / Groth16 AnyVerifyingKey dispatch when `zk` is on.
bn254 = ["cosmwasm-crypto/bn254", "zk-cosmwasm?/bn254"]
# Axiom Halo2 KZG / SHPLONK on BN256 (curve_id 6) AnyVerifyingKey dispatch.
# Host-side only (pulls halo2-axiom + halo2-base with multicore); never for guest wasm32.
halo2-kzg = ["zk-cosmwasm?/halo2-kzg"]
# Native deterministic BLAKE2b-256 / BLAKE3-256 host digests (CPU only).
hash-blake = ["cosmwasm-crypto/hash-blake"]
# Algebraic Poseidon hosts (Zcash Pasta + Penumbra poseidon377).
hash-poseidon = ["cosmwasm-crypto/hash-poseidon", "dep:poseidon377"]
# RedPallas (Orchard) + RedJubjub (Sapling) signature verify hosts.
redpallas = ["cosmwasm-crypto/redpallas"]
# Optional host GPU backend for eligible ZK verify ops (CPU-golden, scheduled gas).
# Default OFF — zero new deps when disabled. Does NOT enable GPU for blake.
# See docs/research/gpu-accel/DESIGN-G1-verifier-backend.md
gpu = ["zk-cosmwasm?/gpu"]

[dependencies]
bech32 = "0.11.0"
blake2 = "0.10.6"
blake3 = "1.5"
clru = "0.6.1"
# Uses the path when built locally; uses the given version from crates.io when published
cosmwasm-core = { workspace = true }
cosmwasm-crypto = { workspace = true }
# Penumbra poseidon377 (BLS12-377 scalar) — test vectors + host import only.
poseidon377 = { version = "1.2.0", optional = true, default-features = false, features = ["arkworks"] }
cosmwasm-std = { workspace = true, features = ["std"] }
cosmwasm-vm-derive = { workspace = true }
crc32fast = "1.3.2"
derive_more = { version = "1.0.0", default-features = false, features = ["debug"] }
# For heap profiling. Only used in the "heap_profiling" example. This has to be a non-dev dependency
# because cargo currently does not support optional dev-dependencies.
dhat = { version = "0.3.3", optional = true }
hex = "0.4"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json = "1.0.140"
sha2 = "0.10"
strum = { version = "0.26.2", default-features = false, features = ["derive"] }
thiserror = "1.0.26"
# We pin wasmer to a specific version because the layout of cached modules can change between patch versions.
wasmer = { version = "=5.0.6", default-features = false, features = ["singlepass"] }
wasmer-middlewares = "=5.0.6"
wasmer-types = "=5.0.6"

halo2_proofs = { package = "zakura-halo2-proofs", git = "https://github.com/permissionlessweb/common", rev = "5364d3d989640e5356351ee8c0d062ca18d4bfaa", default-features = false, features = ["batch"] }
zk-cosmwasm  = { workspace = true, default-features = false, features = ["interface"], optional = true }

tracing = "0.1.38"
tracing-profile = "0.10.11"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
corez = "0.1.1"

[dev-dependencies]
clap = "4"
criterion = { version = "0.5.1", features = ["html_reports"] }
glob = "0.3.1"
hex-literal = "0.4.1"
leb128 = "0.2"
rand = "0.8"
# Signing only for redpallas host round-trip tests (feature-gated usage).
reddsa = { version = "0.5", features = ["std"] }
target-lexicon = "0.12"
tempfile = "3.1.0"
time = { version = "0.3.35", features = ["formatting"] }
wasm-encoder = "0.205.0"
wat = "1.0"

[[bench]]
name = "main"
harness = false

[[bench]]
name = "zk_circuit"
harness = false
required-features = ["zk"]

[[example]]
name = "heap_profiling"
path = "examples/heap_profiling.rs"

[profile.release]
debug = 1
