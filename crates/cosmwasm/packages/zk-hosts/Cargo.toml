[package]
name = "zk-cosmwasm-hosts"
version = "4.0.0-zk"
edition = "2021"
publish = false
description = "Host-only Stwo/Flock Path A verifiers for zk-cosmwasm (not a CosmWasm workspace member)"
license = "Apache-2.0"

[dependencies]
zk-cosmwasm = { path = "../zk", default-features = false }
lean-stwo-dummy = { path = "../zk/vendor/lean-stwo-dummy", default-features = false, features = ["real-stwo"] }
flock-core = { path = "../../../flock/crates/flock-core" }
bincode = "1.3"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
