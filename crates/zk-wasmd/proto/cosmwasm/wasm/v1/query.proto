syntax = "proto3";
package cosmwasm.wasm.v1;

import "gogoproto/gogo.proto";
import "cosmwasm/wasm/v1/types.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/query/v1/query.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/CosmWasm/wasmd/x/wasm/types";
option (gogoproto.goproto_getters_all) = false;
option (gogoproto.equal_all) = false;

// Query provides defines the gRPC querier service
service Query {
  // ContractInfo gets the contract meta data
  rpc ContractInfo(QueryContractInfoRequest)
      returns (QueryContractInfoResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/contract/{address}";
  }
  // ContractHistory gets the contract code history
  rpc ContractHistory(QueryContractHistoryRequest)
      returns (QueryContractHistoryResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get =
        "/cosmwasm/wasm/v1/contract/{address}/history";
  }
  // ContractsByCode lists all smart contracts for a code id
  rpc ContractsByCode(QueryContractsByCodeRequest)
      returns (QueryContractsByCodeResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/code/{code_id}/contracts";
  }
  // AllContractState gets all raw store data for a single contract
  rpc AllContractState(QueryAllContractStateRequest)
      returns (QueryAllContractStateResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/contract/{address}/state";
  }
  // RawContractState gets single key from the raw store data of a contract
  rpc RawContractState(QueryRawContractStateRequest)
      returns (QueryRawContractStateResponse) {
    option (google.api.http).get =
        "/cosmwasm/wasm/v1/contract/{address}/raw/{query_data}";
  }
  // SmartContractState get smart query result from the contract
  rpc SmartContractState(QuerySmartContractStateRequest)
      returns (QuerySmartContractStateResponse) {
    option (google.api.http).get =
        "/cosmwasm/wasm/v1/contract/{address}/smart/{query_data}";
  }
  // Code gets the binary code and metadata for a single wasm code
  rpc Code(QueryCodeRequest) returns (QueryCodeResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/code/{code_id}";
  }

  // Circuit gets reconstructed circuit metadata and binary for a zk_id.
  // Does not expose raw standalone param files.
  rpc Circuit(QueryCircuitRequest) returns (QueryCircuitResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/circuit/{zk_id}";
  }

  // Vk gets circuit/vk binary for a vk/zk id (reconstructed via wasmvm).
  // Raw commitment params are never returned.
  rpc Vk(QueryVkRequest) returns (QueryVkResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/vk/{vk_id}";
  }

  // VkInfo gets verifying-key / circuit metadata (checksums, creator).
  rpc VkInfo(QueryVkInfoRequest) returns (QueryVkInfoResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/vk_info/{vk_id}";
  }

  // VkParam returns param *metadata only* (checksum + creator).
  // Raw param bytes are intentionally not queryable.
  rpc VkParam(QueryVkParamRequest) returns (QueryVkParamResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/vk_param/{param_id}";
  }

  // VkParamInfo returns the same metadata as VkParam (checksums / creator / ids).
  rpc VkParamInfo(QueryVkParamInfoRequest) returns (QueryVkParamInfoResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/vk_param_info/{param_id}";
  }

  // Codes gets the metadata for all stored wasm codes
  rpc Codes(QueryCodesRequest) returns (QueryCodesResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/code";
  }

  // CodeInfo gets the metadata for a single wasm code
  rpc CodeInfo(QueryCodeInfoRequest) returns (QueryCodeInfoResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/code-info/{code_id}";
  }

  // CircuitInfo gets the circuit meta data
  rpc CircuitInfo(QueryCircuitInfoRequest) returns (QueryCircuitInfoResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/circuit-info/{zk_id}";
  }

  // PinnedCodes gets the pinned code ids
  rpc PinnedCodes(QueryPinnedCodesRequest) returns (QueryPinnedCodesResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/codes/pinned";
  }

  // PinnedCircuits gets the pinned code ids
  rpc PinnedCircuits(QueryPinnedCircuitsRequest)
      returns (QueryPinnedCircuitsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/circuits/pinned";
  }

  // Params gets the module params
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/codes/params";
  }

  // ContractsByCreator gets the contracts by creator
  rpc ContractsByCreator(QueryContractsByCreatorRequest)
      returns (QueryContractsByCreatorResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get =
        "/cosmwasm/wasm/v1/contracts/creator/{creator_address}";
  }

  // WasmLimitsConfig gets the configured limits for static validation of Wasm
  // files, encoded in JSON.
  rpc WasmLimitsConfig(QueryWasmLimitsConfigRequest)
      returns (QueryWasmLimitsConfigResponse) {
    option (google.api.http).get = "/cosmwasm/wasm/v1/wasm-limits-config";
  }

  // BuildAddress builds a contract address
  rpc BuildAddress(QueryBuildAddressRequest)
      returns (QueryBuildAddressResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/cosmwasm/wasm/v1/build_address";
  }
}

// QueryContractInfoRequest is the request type for the Query/ContractInfo RPC
// method
message QueryContractInfoRequest {
  // address is the address of the contract to query
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}
// QueryContractInfoResponse is the response type for the Query/ContractInfo RPC
// method
message QueryContractInfoResponse {
  option (gogoproto.equal) = true;

  // address is the address of the contract
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  ContractInfo contract_info = 2 [
    (gogoproto.embed) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.jsontag) = ""
  ];
}

// QueryContractHistoryRequest is the request type for the Query/ContractHistory
// RPC method
message QueryContractHistoryRequest {
  // address is the address of the contract to query
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryContractHistoryResponse is the response type for the
// Query/ContractHistory RPC method
message QueryContractHistoryResponse {
  repeated ContractCodeHistoryEntry entries = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryContractsByCodeRequest is the request type for the Query/ContractsByCode
// RPC method
message QueryContractsByCodeRequest {
  uint64 code_id = 1; // grpc-gateway_out does not support Go style CodeID
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryContractsByCodeResponse is the response type for the
// Query/ContractsByCode RPC method
message QueryContractsByCodeResponse {
  // contracts are a set of contract addresses
  repeated string contracts = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryAllContractStateRequest is the request type for the
// Query/AllContractState RPC method
message QueryAllContractStateRequest {
  // address is the address of the contract
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryAllContractStateResponse is the response type for the
// Query/AllContractState RPC method
message QueryAllContractStateResponse {
  repeated Model models = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryRawContractStateRequest is the request type for the
// Query/RawContractState RPC method
message QueryRawContractStateRequest {
  // address is the address of the contract
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes query_data = 2;
}

// QueryRawContractStateResponse is the response type for the
// Query/RawContractState RPC method
message QueryRawContractStateResponse {
  // Data contains the raw store data
  bytes data = 1;
}

// QuerySmartContractStateRequest is the request type for the
// Query/SmartContractState RPC method
message QuerySmartContractStateRequest {
  // address is the address of the contract
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // QueryData contains the query data passed to the contract
  bytes query_data = 2 [
    (gogoproto.casttype) = "RawContractMessage",
    (amino.encoding) = "inline_json"
  ];
}

// QuerySmartContractStateResponse is the response type for the
// Query/SmartContractState RPC method
message QuerySmartContractStateResponse {
  // Data contains the json data returned from the smart contract
  bytes data = 1 [
    (gogoproto.casttype) = "RawContractMessage",
    (amino.encoding) = "inline_json"
  ];
}

// QueryCodeRequest is the request type for the Query/Code RPC method
message QueryCodeRequest {
  uint64 code_id = 1; // grpc-gateway_out does not support Go style CodeID
}

// QueryCodeResponse is the response type for the Query/Code RPC method
message QueryCodeResponse {
  option (gogoproto.equal) = true;
  CodeInfoResponse code_info = 1
      [ (gogoproto.embed) = true, (gogoproto.jsontag) = "" ];
  bytes data = 2 [ (gogoproto.jsontag) = "data" ];
}

// QueryVkParamInfoRequest is the request type for the Query/VkParamInfo RPC
// method
message QueryVkParamInfoRequest {
  uint64 param_id = 1; // grpc-gateway_out does not support Go style ParamID
}

// QueryVkParamInfoResponse is the response type for the Query/VkParamInfo RPC
// method
message QueryVkParamInfoResponse {
  option (gogoproto.equal) = true;
  VkInfoResponse param_info =
      1; // grpc-gateway_out does not support Go style ParamID
}

// QueryVkParamRequest is the request type for the Query/VkParam RPC method
message QueryVkParamRequest {
  uint64 param_id = 1; // grpc-gateway_out does not support Go style ParamID
}

// QueryVkParamResponse is the response type for the Query/VkParam RPC method.
// Only metadata is returned. The reserved `data` field must remain empty —
// raw commitment params are never served over query.
message QueryVkParamResponse {
  option (gogoproto.equal) = true;
  VkInfoResponse param_info = 1
      [ (gogoproto.embed) = true, (gogoproto.jsontag) = "" ];
  // Deprecated: always empty. Do not use. Raw param bytes are not queryable.
  bytes data = 2 [ (gogoproto.jsontag) = "data", deprecated = true ];
}

// QueryVkInfoRequest is the request type for the Query/VkInfo RPC method
message QueryVkInfoRequest {
  uint64 vk_id = 1; // grpc-gateway_out does not support Go style VkInfo
}

// QueryVkInfoResponse is the response type for the Query/VkInfo RPC method
message QueryVkInfoResponse {
  option (gogoproto.equal) = true;
  VkInfoResponse param_info = 1;
}

// QueryVkRequest is the request type for the Query/Vk RPC method
message QueryVkRequest {
  uint64 vk_id = 1; // grpc-gateway_out does not support Go style VkID
}

// QueryVkResponse is the response type for the Query/Vk RPC method
message QueryVkResponse {
  option (gogoproto.equal) = true;
  VkInfoResponse vk_info = 1
      [ (gogoproto.embed) = true, (gogoproto.jsontag) = "" ];
  bytes data = 2 [ (gogoproto.jsontag) = "data" ];
}

// QueryCircuitRequest is the request type for the Query/Circuit RPC method
message QueryCircuitRequest {
  uint64 zk_id = 1; // grpc-gateway_out does not support Go style ZkID
}

// QueryCircuitResponse is the response type for the Query/Circuit RPC method
message QueryCircuitResponse {
  option (gogoproto.equal) = true;
  CircuitInfoResponse circuit_info = 1
      [ (gogoproto.embed) = true, (gogoproto.jsontag) = "" ];
  bytes data = 2 [ (gogoproto.jsontag) = "data" ];
}

// QueryCodeInfoRequest is the request type for the Query/CodeInfo RPC method
message QueryCodeInfoRequest {
  uint64 code_id = 1; // grpc-gateway_out does not support Go style CodeID
}

// QueryCodeInfoResponse is the response type for the Query/CodeInfo RPC method
message QueryCodeInfoResponse {
  option (gogoproto.equal) = true;

  uint64 code_id = 1 [ (gogoproto.customname) = "CodeID" ];
  string creator = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes checksum = 3 [ (gogoproto.casttype) =
                           "github.com/cometbft/cometbft/libs/bytes.HexBytes" ];
  AccessConfig instantiate_permission = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// CodeInfoResponse contains code meta data from CodeInfo
message CodeInfoResponse {
  option (gogoproto.equal) = true;

  uint64 code_id = 1 [
    (gogoproto.customname) = "CodeID",
    (gogoproto.jsontag) = "id"
  ]; // id for legacy support
  string creator = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes data_hash = 3
      [ (gogoproto.casttype) =
            "github.com/cometbft/cometbft/libs/bytes.HexBytes" ];
  // Used in v1beta1
  reserved 4, 5;
  AccessConfig instantiate_permission = 6
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryCircuitInfoRequest is the request type for the Query/CircuitINfo RPC
// method
message QueryCircuitInfoRequest {
  uint64 zk_id = 1; // grpc-gateway_out does not support Go style ZkID
}

// QueryCircuitInfoResponse is the response type for the Query/CircuitInfo RPC
// method
message QueryCircuitInfoResponse {
  option (gogoproto.equal) = true;

  uint64 zk_id = 1 [ (gogoproto.customname) = "ZkID" ];
  string creator = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes checksum = 3 [ (gogoproto.casttype) =
                           "github.com/cometbft/cometbft/libs/bytes.HexBytes" ];
  AccessConfig instantiate_permission = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// CodeInfoResponse contains code meta data from CodeInfo
message CircuitInfoResponse {
  option (gogoproto.equal) = true;
  uint64 zk_id = 1
      [ (gogoproto.customname) = "ZkID", (gogoproto.jsontag) = "id" ];
  VkParamInfoResponse param_info = 2 [
    (gogoproto.customname) = "ParamInfo",
    (gogoproto.jsontag) = "param_info"
  ];
  VkInfoResponse vk_info = 3
      [ (gogoproto.customname) = "ParamID", (gogoproto.jsontag) = "param_id" ];
  string creator = 4 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes data_hash = 5
      [ (gogoproto.casttype) =
            "github.com/cometbft/cometbft/libs/bytes.HexBytes" ];
  AccessConfig instantiate_permission = 6
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// ParamInfoResponse contains code meta data from VkParamInfo
message VkParamInfoResponse {
  option (gogoproto.equal) = true;
  uint64 param_id = 1
      [ (gogoproto.customname) = "VkID", (gogoproto.jsontag) = "param_id" ];
  string creator = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes data_hash = 3
      [ (gogoproto.casttype) =
            "github.com/cometbft/cometbft/libs/bytes.HexBytes" ];
  AccessConfig instantiate_permission = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// VkInfoResponse contains code meta data from CodeInfo
message VkInfoResponse {
  option (gogoproto.equal) = true;
  uint64 vk_id = 1
      [ (gogoproto.customname) = "VkID", (gogoproto.jsontag) = "id" ];
  uint64 cs_id = 2
      [ (gogoproto.customname) = "CSId", (gogoproto.jsontag) = "cs_id" ];
  string creator = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes data_hash = 4
      [ (gogoproto.casttype) =
            "github.com/cometbft/cometbft/libs/bytes.HexBytes" ];
  AccessConfig instantiate_permission = 5
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryCodesRequest is the request type for the Query/Codes RPC method
message QueryCodesRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryCodesResponse is the response type for the Query/Codes RPC method
message QueryCodesResponse {
  repeated CodeInfoResponse code_infos = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPinnedCodesRequest is the request type for the Query/PinnedCodes
// RPC method
message QueryPinnedCodesRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryPinnedCodesResponse is the response type for the
// Query/PinnedCodes RPC method
message QueryPinnedCodesResponse {
  repeated uint64 code_ids = 1 [ (gogoproto.customname) = "CodeIDs" ];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPinnedCircuitsRequest is the request type for the Query/PinnedCircuits
// RPC method
message QueryPinnedCircuitsRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryPinnedCircuitsResponse is the response type for the
// Query/PinnedCircuits RPC method
message QueryPinnedCircuitsResponse {
  repeated uint64 zk_ids = 1 [ (gogoproto.customname) = "ZkIDs" ];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryParamsRequest is the request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params defines the parameters of the module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// QueryContractsByCreatorRequest is the request type for the
// Query/ContractsByCreator RPC method.
message QueryContractsByCreatorRequest {
  // CreatorAddress is the address of contract creator
  string creator_address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryContractsByCreatorResponse is the response type for the
// Query/ContractsByCreator RPC method.
message QueryContractsByCreatorResponse {
  // ContractAddresses result set
  repeated string contract_addresses = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryWasmLimitsConfigRequest is the request type for the
// Query/WasmLimitsConfig RPC method.
message QueryWasmLimitsConfigRequest {}

// QueryWasmLimitsConfigResponse is the response type for the
// Query/WasmLimitsConfig RPC method. It contains the JSON encoded limits for
// static validation of Wasm files.
message QueryWasmLimitsConfigResponse { string config = 1; }

// QueryBuildAddressRequest is the request type for the Query/BuildAddress RPC
// method.
message QueryBuildAddressRequest {
  // CodeHash is the hash of the code
  string code_hash = 1;
  // CreatorAddress is the address of the contract instantiator
  string creator_address = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Salt is a hex encoded salt
  string salt = 3;
  // InitArgs are optional json encoded init args to be used in contract address
  // building if provided
  bytes init_args = 4;
}

// QueryBuildAddressResponse is the response type for the Query/BuildAddress RPC
// method.
message QueryBuildAddressResponse {
  // Address is the contract address
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}
