syntax = "proto3";
package cosmwasm.wasm.v1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";
import "cosmwasm/wasm/v1/types.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "github.com/CosmWasm/wasmd/x/wasm/types";
option (gogoproto.goproto_getters_all) = false;

// Msg defines the wasm Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  // StoreCode to submit Wasm code to the system
  rpc StoreCode(MsgStoreCode) returns (MsgStoreCodeResponse);
  // Store reusable constraint system parameters (k, curve & prover type
  // invariant)
  rpc StoreVkParam(MsgStoreVkParam) returns (MsgStoreVkParamResponse);
  // Store a Verifying Key that references previously uploaded params
  rpc StoreCircuit(MsgStoreCircuit) returns (MsgStoreCircuitResponse);
  // Convenience: upload everything in one go
  rpc StoreFullCircuit(MsgStoreFullCircuit)
      returns (MsgStoreFullCircuitResponse);
  //  InstantiateContract creates a new smart contract instance for the given
  //  code id.
  rpc InstantiateContract(MsgInstantiateContract)
      returns (MsgInstantiateContractResponse);
  //  InstantiateContract2 creates a new smart contract instance for the given
  //  code id with a predictable address
  rpc InstantiateContract2(MsgInstantiateContract2)
      returns (MsgInstantiateContract2Response);
  // Execute submits the given message data to a smart contract
  rpc ExecuteContract(MsgExecuteContract) returns (MsgExecuteContractResponse);
  // Migrate runs a code upgrade/ downgrade for a smart contract
  rpc MigrateContract(MsgMigrateContract) returns (MsgMigrateContractResponse);
  // UpdateAdmin sets a new admin for a smart contract
  rpc UpdateAdmin(MsgUpdateAdmin) returns (MsgUpdateAdminResponse);
  // ClearAdmin removes any admin stored for a smart contract
  rpc ClearAdmin(MsgClearAdmin) returns (MsgClearAdminResponse);
  // UpdateInstantiateConfig updates instantiate config for a smart contract
  rpc UpdateInstantiateConfig(MsgUpdateInstantiateConfig)
      returns (MsgUpdateInstantiateConfigResponse);
  // UpdateParams defines a governance operation for updating the x/wasm
  // module parameters. The authority is defined in the keeper.
  //
  // Since: 0.40
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // SudoContract defines a governance operation for calling sudo
  // on a contract. The authority is defined in the keeper.
  //
  // Since: 0.40
  rpc SudoContract(MsgSudoContract) returns (MsgSudoContractResponse);
  // PinCodes defines a governance operation for pinning a set of
  // code ids in the wasmvm cache. The authority is defined in the keeper.
  //
  // Since: 0.40
  rpc PinCodes(MsgPinCodes) returns (MsgPinCodesResponse);
  // UnpinCodes defines a governance operation for unpinning a set of
  // code ids in the wasmvm cache. The authority is defined in the keeper.
  //
  // Since: 0.40
  rpc UnpinCodes(MsgUnpinCodes) returns (MsgUnpinCodesResponse);
  // UnpinCircuits defines a governance operation for unpinning a set of
  // zk-IDs in the zk-wasmvm cache. The authority is defined in the keeper.
  rpc UnpinCircuits(MsgUnpinCircuits) returns (MsgUnpinCircuitsResponse);
  // StoreAndInstantiateContract defines a governance operation for storing
  // and instantiating the contract. The authority is defined in the keeper.
  //
  // Since: 0.40
  rpc StoreAndInstantiateContract(MsgStoreAndInstantiateContract)
      returns (MsgStoreAndInstantiateContractResponse);
  // RemoveCodeUploadParamsAddresses defines a governance operation for
  // removing addresses from code upload params.
  // The authority is defined in the keeper.
  rpc RemoveCodeUploadParamsAddresses(MsgRemoveCodeUploadParamsAddresses)
      returns (MsgRemoveCodeUploadParamsAddressesResponse);
  // RemoveCodeUploadParamsAddresses defines a governance operation for
  // removing addresses from circuit upload params
  rpc RemoveCircuitUploadParamsAddresses(MsgRemoveCircuitUploadParamsAddresses)
      returns (MsgRemoveCircuitUploadParamsAddressesResponse);
  // AddCodeUploadParamsAddresses defines a governance operation for
  // adding addresses to code upload params.
  // The authority is defined in the keeper.
  rpc AddCodeUploadParamsAddresses(MsgAddCodeUploadParamsAddresses)
      returns (MsgAddCodeUploadParamsAddressesResponse);
  // AddCircuitUploadParamsAddresses defines a governance operation for
  // adding addresses to circuit upload params.
  // The authority is defined in the keeper.
  rpc AddCircuitUploadParamsAddresses(MsgAddCircuitUploadParamsAddresses)
      returns (MsgAddCircuitUploadParamsAddressesResponse);
  // StoreAndMigrateContract defines a governance operation for storing
  // and migrating the contract. The authority is defined in the keeper.
  //
  // Since: 0.42
  rpc StoreAndMigrateContract(MsgStoreAndMigrateContract)
      returns (MsgStoreAndMigrateContractResponse);
  // UpdateContractLabel sets a new label for a smart contract
  //
  // Since: 0.43
  rpc UpdateContractLabel(MsgUpdateContractLabel)
      returns (MsgUpdateContractLabelResponse);
  // PayCircuitDeposit prepaid yearly circuit-upload coverage for sender.
  // CircuitUploadAccess allowlist / Everybody / gov skip this.
  rpc PayCircuitDeposit(MsgPayCircuitDeposit)
      returns (MsgPayCircuitDepositResponse);
}

// MsgStoreCode submit Wasm code to the system
message MsgStoreCode {
  option (amino.name) = "wasm/MsgStoreCode";
  option (cosmos.msg.v1.signer) = "sender";

  // Sender is the actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // WASMByteCode can be raw or gzip compressed
  bytes wasm_byte_code = 2 [ (gogoproto.customname) = "WASMByteCode" ];
  // Used in v1beta1
  reserved 3, 4;
  // InstantiatePermission access control to apply on contract creation,
  // optional
  AccessConfig instantiate_permission = 5;
}
// MsgStoreCodeResponse returns store result data.
message MsgStoreCodeResponse {
  // CodeID is the reference to the stored WASM code
  uint64 code_id = 1 [ (gogoproto.customname) = "CodeID" ];
  // Checksum is the sha256 hash of the stored code
  bytes checksum = 2;
}

// MsgStoreCircuitParam submit Circuit Constraint System Param code to the
// system.
message MsgStoreVkParam {
  option (amino.name) = "wasm/MsgStoreCircuitParam";
  option (cosmos.msg.v1.signer) = "sender";
  // Sender is the actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // CircuitParamAuth is the structure used to hold the circuit proving and
  // curve type identifiers.
  CircuitParamAuth auth = 2 [ (gogoproto.customname) = "CircuitParamAuth" ];
  ;
  // params: can be raw or gzip compressed
  bytes params = 3 [ (gogoproto.customname) = "CsParam" ];
}

// MsgStoreCircuitResponse returns store result data.
message MsgStoreVkParamResponse {
  // CodeID is the reference to the stored WASM code
  uint64 cs_param_id = 1 [ (gogoproto.customname) = "CsParamID" ];
  // Checksum key of the cs_param_id
  bytes checksum = 2;
}

// CircuitParamAuth returns store result data.
message CircuitParamAuth {
  // CircuitType is the reference to the type of proving system compatible
  uint64 circuit_type = 1 [ (gogoproto.customname) = "CircuitType" ];
  // CurveType is the reference to the type of proving system compatible
  uint64 curve_type = 2 [ (gogoproto.customname) = "CurveType" ];
  // K is the params constraint system K value
  uint64 k = 3 [ (gogoproto.customname) = "K" ];
}

// MsgStoreCircuit submit Circuit code to the system
// requires params to already have been uploaded.
message MsgStoreCircuit {
  option (amino.name) = "wasm/MsgStoreCircuit";
  option (cosmos.msg.v1.signer) = "sender";
  // Sender is the actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // CircuitParamKey appstate key generated from CircuitParamAuth to use for
  // this Circuit. errors if does not exist or incompatible with this circuit
  // type.
  uint64 param_key = 2 [ (gogoproto.customname) = "CircuitParamKey" ];
  // CircuitBinaryFile can be raw or gzip compressed
  bytes vk_body = 3 [ (gogoproto.customname) = "CircuitBinaryFile" ];
  // InstantiatePermission access control to apply on contract creation,
  // (anyone, these-people, only me) optional
  AccessConfig instantiate_permission = 4;
}

// MsgStoreCircuitResponse returns store result data.
message MsgStoreCircuitResponse {
  // CodeID is the reference to the stored WASM code
  uint64 zk_id = 1 [ (gogoproto.customname) = "ZkID" ];
  // Checksum is the sha256 hash of the stored code
  bytes checksum = 2;
}

// MsgStoreFullCircuit
message MsgStoreFullCircuit {
  option (amino.name) = "wasm/MsgStoreFullCircuit";
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  CircuitParamAuth auth = 2;
  bytes params_body = 3 [ (gogoproto.customname) = "CircuitParamBinaryFile" ];
  bytes vk_body = 4 [ (gogoproto.customname) = "CircuitVkBinaryFile" ];
}

// MsgStoreCircuitResponse returns store result data.
message MsgStoreFullCircuitResponse {
  uint64 cs_param_id = 1;
  uint64 zk_id = 2;
  bytes cs_checksum = 3;
  bytes vk_checksum = 4;
}

// MsgInstantiateContract create a new smart contract instance for the given
// code id.
message MsgInstantiateContract {
  option (amino.name) = "wasm/MsgInstantiateContract";
  option (cosmos.msg.v1.signer) = "sender";

  // Sender is the that actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Admin is an optional address that can execute migrations
  string admin = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // CodeID is the reference to the stored WASM code
  uint64 code_id = 3 [ (gogoproto.customname) = "CodeID" ];
  // Label is optional metadata to be stored with a contract instance.
  string label = 4;
  // Msg json encoded message to be passed to the contract on instantiation
  bytes msg = 5 [
    (gogoproto.casttype) = "RawContractMessage",
    (amino.encoding) = "inline_json"
  ];
  // Funds coins that are transferred to the contract on instantiation
  repeated cosmos.base.v1beta1.Coin funds = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.encoding) = "legacy_coins"
  ];
}

// MsgInstantiateContractResponse return instantiation result data
message MsgInstantiateContractResponse {
  // Address is the bech32 address of the new contract instance.
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Data contains bytes to returned from the contract
  bytes data = 2;
}

// MsgInstantiateContract2 create a new smart contract instance for the given
// code id with a predictable address.
message MsgInstantiateContract2 {
  option (amino.name) = "wasm/MsgInstantiateContract2";
  option (cosmos.msg.v1.signer) = "sender";

  // Sender is the that actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Admin is an optional address that can execute migrations
  string admin = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // CodeID is the reference to the stored WASM code
  uint64 code_id = 3 [ (gogoproto.customname) = "CodeID" ];
  // Label is optional metadata to be stored with a contract instance.
  string label = 4;
  // Msg json encoded message to be passed to the contract on instantiation
  bytes msg = 5 [
    (gogoproto.casttype) = "RawContractMessage",
    (amino.encoding) = "inline_json"
  ];
  // Funds coins that are transferred to the contract on instantiation
  repeated cosmos.base.v1beta1.Coin funds = 6 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.encoding) = "legacy_coins"
  ];
  // Salt is an arbitrary value provided by the sender. Size can be 1 to 64.
  bytes salt = 7;
  // FixMsg include the msg value into the hash for the predictable address.
  // Default is false
  bool fix_msg = 8;
}

// MsgInstantiateContract2Response return instantiation result data
message MsgInstantiateContract2Response {
  // Address is the bech32 address of the new contract instance.
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Data contains bytes to returned from the contract
  bytes data = 2;
}

// MsgExecuteContract submits the given message data to a smart contract
message MsgExecuteContract {
  option (amino.name) = "wasm/MsgExecuteContract";
  option (cosmos.msg.v1.signer) = "sender";

  // Sender is the that actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Contract is the address of the smart contract
  string contract = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Msg json encoded message to be passed to the contract
  bytes msg = 3 [
    (gogoproto.casttype) = "RawContractMessage",
    (amino.encoding) = "inline_json"
  ];
  // Funds coins that are transferred to the contract on execution
  repeated cosmos.base.v1beta1.Coin funds = 5 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.encoding) = "legacy_coins"
  ];
}

// MsgExecuteContractResponse returns execution result data.
message MsgExecuteContractResponse {
  // Data contains bytes to returned from the contract
  bytes data = 1;
}

// MsgMigrateContract runs a code upgrade/ downgrade for a smart contract
message MsgMigrateContract {
  option (amino.name) = "wasm/MsgMigrateContract";
  option (cosmos.msg.v1.signer) = "sender";

  // Sender is the that actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Contract is the address of the smart contract
  string contract = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // CodeID references the new WASM code
  uint64 code_id = 3 [ (gogoproto.customname) = "CodeID" ];
  // Msg json encoded message to be passed to the contract on migration
  bytes msg = 4 [
    (gogoproto.casttype) = "RawContractMessage",
    (amino.encoding) = "inline_json"
  ];
}

// MsgMigrateContractResponse returns contract migration result data.
message MsgMigrateContractResponse {
  // Data contains same raw bytes returned as data from the wasm contract.
  // (May be empty)
  bytes data = 1;
}

// MsgUpdateAdmin sets a new admin for a smart contract
message MsgUpdateAdmin {
  option (amino.name) = "wasm/MsgUpdateAdmin";
  option (cosmos.msg.v1.signer) = "sender";

  // Sender is the that actor that signed the messages
  string sender = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NewAdmin address to be set
  string new_admin = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Contract is the address of the smart contract
  string contract = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// MsgUpdateAdminResponse returns empty data
message MsgUpdateAdminResponse {}

// MsgClearAdmin removes any admin stored for a smart contract
message MsgClearAdmin {
  option (amino.name) = "wasm/MsgClearAdmin";
